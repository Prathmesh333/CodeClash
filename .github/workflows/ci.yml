name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:problems
      - run: python3 -m unittest discover -s tests/unit -p "*_test.py"
      # Real local Worker, Durable Objects and D1: needs the wrangler dev server, not a mock.
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm exec playwright test casual.spec.ts
        env:
          CASUAL_E2E: "true"
      - run: node -e "const p=require('./package.json');console.log(JSON.stringify({node:process.version,pnpm:require('child_process').execSync('pnpm --version').toString().trim(),deps:{...p.dependencies,...p.devDependencies}},null,2))" > version-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-evidence
          path: |
            playwright-report/
            test-results/
            work/
            version-manifest.json
          retention-days: 14
  judge:
    # Security gate for the isolated Python runtime. Never satisfiable by a mock: the fixtures run
    # inside the built image only. A failure here blocks promotion.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:judge
      - run: pnpm test:security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: judge-evidence
          path: work/
          retention-days: 14
